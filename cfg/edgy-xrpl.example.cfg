# Edgy configuration for edgy-xrpld (xrpld-style stanzas).
# Copy to edgy-xrpl.cfg or pass --conf /path/to/file.
# Blank lines and '#' comments are ignored.
# CLI flags override this file. EDGY_NODE overrides [node].

# Diagnostic log (also stays on the terminal). Rotated to
# <path>.YYYYMMDD-HHMMSS on each start so this file is the current run.
[debug]
/tmp/edgy-xrpl.log

# Local WebSocket (path_find + proxy). host:port
[listen-ws]
0.0.0.0:6008

# Local JSON-RPC HTTP. host:port
[listen-rpc]
0.0.0.0:5008

# Upstream xrpld WebSocket.
[node]
ws://127.0.0.1:6006

# Concurrent path_find worker threads (1–256).
[workers]
64

# Network event-loop threads (local WS/HTTP + upstream node). Not disk I/O.
# Path search uses [workers].
[net-threads]
4

# How often open path_find sockets are repriced (milliseconds).
[update-ms]
100

# Forward unknown RPC/WS commands to [node]. 0/1, yes/no, on/off.
[proxy]
1

# Target / one-shot search depth: fast | mid | full (default full).
[search]
full

# First WebSocket reply depth: fast | mid | full (default fast).
[search-fast]
fast

# Abort a single search after N ms. 0 / full / none = no timeout.
[timeout-ms]
0

# 1 / full = every ledger object. 0 / books = offers, AMMs, directories, accounts, lines.
[full-snapshot]
full

# Binary ledger_data objects per page (1–2048). xrpld/xahaud binary max is 2048.
[snapshot-page]
2048

# Trust-line cache used while building source/dest currency sets.
[max_total_lines]
1000000

# Per-account trust-line cap in that cache.
[max_lines_per_account]
50000

# How many lines to fetch per cache expand step.
[line_chunk_size]
64

# Reuse the line cache across this many ledgers.
[cache_reuse_ledgers]
6
